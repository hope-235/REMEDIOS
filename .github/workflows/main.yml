name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project files
        run: |
          flutter create --platforms android --project-name remediosring .
          
      - name: Add Android Permissions
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n\
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n\
          <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n\
          <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n\
          <uses-permission android:name="android.permission.VIBRATE"/>\n' $MANIFEST_PATH

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: remediosring-apk
          path: build/app/outputs/flutter-apk/app-release.apk
